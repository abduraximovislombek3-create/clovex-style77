<title>CLOVEX STYLE</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:#ead7a2;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at 50% 18%,#800909 0,#4b0000 48%,#210000 100%);
}
.wrap{max-width:680px;margin:auto;padding:38px 24px 28px;text-align:center}
.logo{
  width:128px;height:128px;margin:28px auto;border-radius:50%;
  border:3px solid #d2a44a;padding:7px;background:#d4bd91;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px #3b160d,0 0 30px #9b5c25;
}
.logo span{color:#32150f;font-family:Georgia,serif;font-weight:bold;font-size:14px;line-height:1.2;letter-spacing:1px}
h1{margin:0;color:#f5ead0;font-size:36px;letter-spacing:5px}
.sub{margin:12px 0 38px;letter-spacing:9px;color:#d2a44a}
.line{width:65px;height:2px;background:#b88932;margin:0 auto 35px;box-shadow:0 0 10px #b88932}
a{
 display:flex;align-items:center;gap:20px;text-decoration:none;color:#ead7a2;
 margin:18px 0;padding:20px 26px;border:1px solid #9b4b28;border-radius:22px;
 background:rgba(120,0,0,.32);font-size:19px;text-align:left;transition:.2s
}
a:hover{transform:translateY(-2px);background:rgba(150,0,0,.45)}
.icon{width:48px;height:48px;border:2px solid #b88932;border-radius:50%;
display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.note{margin-top:105px;font-size:13px;opacity:.35;letter-spacing:1px}
.version{margin-top:22px;font-size:12px;opacity:.25}

.icon svg{width:24px;height:24px;fill:none;stroke:#d2a44a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon svg path:first-child{fill:#d2a44a;stroke:#d2a44a}
.icon svg rect,.icon svg circle{stroke:#d2a44a}
</style>
</head>
